<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Add Dataset</title>
	<link href="/style.css" rel="stylesheet"/>
</head>
<body>

<label for="addIdInput">Name of dataset to Add:</label>
<input id="addIdInput" type="text" required>
<label for="addKindInput">Kind of dataset to Add:</label>
<select id="addKindInput">
	<option value="courses">Course</option>
	<option value="rooms">Room</option>
</select>
<label for="fileInput">Please attach the ZIP file to be added:</label>
<input id="fileInput" type="file" required>
<button class="button" id="submitAddRequest">Add Dataset</button>
<a id="addResult"></a>

<a href="index.html">
	<button class="back-button" id="homeButton">Back</button>
</a>

<script src="js/http.js" type="text/javascript"></script>
<script src="js/add.js" type="text/javascript"></script>
</body>
</html>
